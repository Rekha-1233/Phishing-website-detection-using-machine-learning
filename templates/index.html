<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phishing Detection System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #0d6efd;
      color: white;
      padding: 1rem 2rem;
      text-align: center;
    }

    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .welcome {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #333;
    }

    .subtext {
      font-size: 1rem;
      color: #555;
      margin-bottom: 2rem;
      max-width: 600px;
      text-align: center;
    }

    .scan-box {
      background: white;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      margin-bottom: 2rem;
    }

    .scan-box input {
      padding: 0.7rem;
      width: 300px;
      max-width: 90%;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    .scan-box button {
      padding: 0.7rem 1.5rem;
      margin-left: 10px;
      background-color: #198754;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }

    .scan-box button:hover {
      background-color: #157347;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
    }

    .btn {
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-login {
      background-color: #0d6efd;
      color: white;
    }

    .btn-login:hover {
      background-color: #0b5ed7;
    }

    .btn-register {
      background-color: white;
      color: #0d6efd;
      border: 2px solid #0d6efd;
    }

    .btn-register:hover {
      background-color: #eaf2ff;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #e9ecef;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>Phishing Detection System</h1>
  </header>

  <main>
    <div class="welcome">Welcome to the Secure URL Scanner</div>
    <div class="subtext">
      Protect yourself from phishing attacks.<br>
      Scan any suspicious URL, but please login first to access full features.
    </div>

    <div class="scan-box">
      <input type="text" id="urlInput" placeholder="Enter URL to scan...">
      <button onclick="redirectToLogin()">Scan Now</button>
    </div>

    <div class="btn-group">
      <a href="/login"><button class="btn btn-login">Login</button></a>
      <a href="/register"><button class="btn btn-register">Register</button></a>
    </div>
  </main>

  <footer>
    &copy; 2025 SecureURL AI | Stay Safe Online
  </footer>

  <script>
    function redirectToLogin() {
      const url = document.getElementById('urlInput').value.trim();
      if (url === "") {
        alert(" Please enter a URL to scan.");
        return;
      }
      alert("You must be logged in to scan URLs. Redirecting to Login...");
      window.location.href = "/login";
    }
  </script>

</body>
</html>
