<!-- templates/register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phishing Detection | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Poppins", "Segoe UI", sans-serif;
      background-color: #edf3fb; /* 👈 Soft bluish-grey */
    }

    .container-flex {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* Left Panel (Register Form) */
    .left-panel {
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-color: #edf3fb;
    }

    /* Right Panel with Image */
    .right-panel {
      width: 50%;
      background: #edf3fb url("/static/images/img.png") no-repeat center center;
      background-size: cover;
      border-left: 3px solid #d6e4ff;
    }

    /* Card Design */
    .card {
      background: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      transition: all 0.3s ease-in-out;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .card h3 {
      font-weight: 600;
      font-size: 22px;
      text-align: center;
      margin-bottom: 8px;
      color: #1a2a4f;
    }

    .card p {
      text-align: center;
      color: #555;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .form-label {
      font-weight: 500;
      font-size: 14px;
    }

    .form-control {
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccd7ff;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 8px rgba(13,110,253,0.3);
    }

    .btn-register {
      background: linear-gradient(90deg, #0d6efd, #4a8cff);
      color: white;
      font-weight: 600;
      border-radius: 8px;
      padding: 10px;
      font-size: 15px;
      border: none;
      transition: all 0.3s ease;
    }

    .btn-register:hover {
      background: linear-gradient(90deg, #0a58ca, #2e6ee9);
      transform: scale(1.02);
    }

    .text-muted a {
      color: #0d6efd;
      text-decoration: none;
      font-weight: 500;
    }

    .text-muted a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .container-flex {
        flex-direction: column;
      }
      .right-panel {
        width: 100%;
        height: 200px;
        border-left: none;
        border-top: 3px solid #d6e4ff;
      }
      .left-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container-flex">
  <!-- Left Panel: Register -->
  <div class="left-panel">
    <div class="card">
      <h3><i class="fas fa-user-plus text-primary"></i> Create Account</h3>
      <p>Join URL Guardian to protect against phishing attacks</p>

      <form action="/register" method="POST">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="user@example.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-register w-100">Create Account</button>
        <div class="text-center mt-3">
          <small class="text-muted">Already have an account? <a href="/login">Sign in</a></small>
        </div>
      </form>
    </div>
  </div>

  <!-- Right Panel: Image -->
  <div class="right-panel"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
